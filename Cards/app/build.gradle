apply plugin: 'com.android.application'

android {
    namespace "com.andreaak.cards"
    compileSdk 34
    defaultConfig {
        applicationId "com.andreaak.cards"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation "androidx.activity:activity:1.7.2"
    implementation 'androidx.appcompat:appcompat:1.6.1'
//    implementation 'com.google.android.gms:play-services-identity:8.1.0'
//    implementation 'com.google.apis:google-api-services-drive:v2-rev105-1.17.0-rc'
//    implementation 'com.google.api-client:google-api-client-android:1.20.0'
//    implementation 'com.google.http-client:google-http-client-gson:1.20.0'

    testImplementation 'junit:junit:4.12'
    implementation project(path: ':common')


}
